name: PR check

# Runs this repository's own checker against each pull request, using the
# rules in pr-rules.md, and keeps one comment on the pull request up to date.
# Drafts are left alone: a check spends a share of the day's model budget,
# and a draft is pushed to often.
#
# Two status checks come out of it, so branch protection can require either.
# "rules" fails when a rule fails on a line the pull request adds. "verified"
# fails unless every changed file was checked and every rule passed; a check
# that did not run, or a checker that is not configured, fails it too.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  check:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      status: ${{ steps.check.outputs.status }}
      verified: ${{ steps.check.outputs.verified }}
    env:
      CHECKER_URL: ${{ secrets.CHECKER_URL }}
      CHECKER_API_TOKEN: ${{ secrets.CHECKER_API_TOKEN }}
      PR_URL: ${{ github.event.pull_request.html_url }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - if: env.CHECKER_URL == '' || env.CHECKER_API_TOKEN == ''
        run: echo "::notice::CHECKER_URL and CHECKER_API_TOKEN are not set, so this pull request is not checked."

      - if: env.CHECKER_URL != '' && env.CHECKER_API_TOKEN != ''
        id: check
        run: |
          code=$(curl -sS -o result.json -w '%{http_code}' \
            -X POST "$CHECKER_URL/api/check" \
            -H "authorization: Bearer $CHECKER_API_TOKEN" \
            -H "content-type: application/json" \
            -d "$(jq -cn --arg url "$PR_URL" '{prUrl: $url, workspace: "ci"}')")
          if [ "$code" != 200 ]; then
            echo "::error::The checker answered $code: $(cat result.json)"
            exit 1
          fi
          jq -r .report_markdown result.json > report.md
          cat report.md >> "$GITHUB_STEP_SUMMARY"
          status=$(jq -r .status result.json)
          # Verified means more than a passing status: every changed file
          # was checked, and no rule failed anywhere, pre-existing included.
          verified=$(jq -r '(.status == "pass") and .coverage_complete and all(.rules[]; .status == "PASS" or .status == "NA")' result.json)
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "verified=$verified" >> "$GITHUB_OUTPUT"
          case "$status" in
            pass) echo "::notice::No rule fails on any checked file." ;;
            unsure) echo "::warning::Not every rule could be verified. See Questions and Not checked in the report." ;;
            fail) echo "::error::A rule fails on a line this pull request adds. See Blocking in the report." ;;
          esac

      - if: steps.check.outcome == 'success' && env.SAME_REPO == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          marker='<!-- cf-ai-pr-checker -->'
          { echo "$marker"; echo; head -c 60000 report.md; } > comment.md
          if [ "$(wc -c < report.md)" -gt 60000 ]; then
            echo "[cut: the full report is in the job summary]" >> comment.md
          fi
          id=$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" --paginate \
            --jq ".[] | select(.user.type == \"Bot\" and (.body | startswith(\"$marker\"))) | .id" | head -n 1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -F body=@comment.md > /dev/null
          else
            gh api "repos/$REPO/issues/$PR_NUMBER/comments" -F body=@comment.md > /dev/null
          fi

  # A skipped job counts as passing for a required check, so these two run
  # whenever the check job did and read how it ended.
  rules:
    needs: check
    if: always() && github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      RESULT: ${{ needs.check.result }}
      STATUS: ${{ needs.check.outputs.status }}
    steps:
      - run: |
          case "$RESULT/$STATUS" in
            success/) echo "::notice::Not checked: the checker is not configured." ;;
            success/fail) echo "::error::A rule fails. See the PR check comment or the job summary."; exit 1 ;;
            success/*) echo "No rule fails." ;;
            *) echo "::error::The check did not run."; exit 1 ;;
          esac

  verified:
    needs: check
    if: always() && github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      RESULT: ${{ needs.check.result }}
      STATUS: ${{ needs.check.outputs.status }}
      VERIFIED: ${{ needs.check.outputs.verified }}
    steps:
      - run: |
          case "$RESULT/$VERIFIED" in
            success/true) echo "Every changed file was checked and every rule passed." ;;
            success/false) echo "::error::Not verified: the check ended $STATUS, but not every changed file was checked with every rule passing. See the PR check comment or the job summary."; exit 1 ;;
            success/) echo "::error::Not verified: the checker is not configured."; exit 1 ;;
            *) echo "::error::The check did not run."; exit 1 ;;
          esac
